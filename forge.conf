# Forge — initial configuration model
#
# This file defines the initial practical scope before implementation starts.
# It is intentionally small. New options should only be added when a concrete
# requirement needs them.


# -----------------------------------------------------------------------------
# Scope
# -----------------------------------------------------------------------------

# Update the local Proxmox host.
UPDATE_HOST=true

# Update LXC containers.
UPDATE_LXC=true

# Not part of the initial implementation scope.
UPDATE_VM=false
UPDATE_EXTERNAL=false

# LXC lifecycle selection.
UPDATE_RUNNING_LXC=true
UPDATE_STOPPED_LXC=false

# Proxmox LXC templates are never update targets. They are clone/template
# sources, not Community Scripts application-update helpers.


# -----------------------------------------------------------------------------
# Selection
# -----------------------------------------------------------------------------

# A single guest must be selectable at invocation time by Proxmox VMID or
# guest name. This is a runtime argument, not persistent configuration.

# Optional persistent target filters. Disabled by default.
# UPDATE_ONLY=""
# UPDATE_EXCLUDE=""


# -----------------------------------------------------------------------------
# Execution and failure semantics
# -----------------------------------------------------------------------------

# Forge runs are started manually in the initial scope. There are no scheduled
# jobs or background update jobs.
#
# Update operations themselves are deterministic and non-interactive: Forge
# must supply the package-manager/helper options needed to prevent prompts.
# Conditions that require a decision or additional resources are handled by
# configuration/preflight or reported as failures; they are not interactive
# questions during an update.

# Failure handling is authoritative per target:
#   required step fails
#     -> target update fails
#     -> attempt rollback/recovery for that target
#     -> preserve the real failure/result
#     -> continue with the remaining targets
CONTINUE_AFTER_TARGET_FAILURE=true


# -----------------------------------------------------------------------------
# LXC update stages
# -----------------------------------------------------------------------------

# Update the container operating system/packages.
UPDATE_LXC_OS=true

# Run the application updater installed by Proxmox Community Scripts when one
# is present and supported.
UPDATE_LXC_APPLICATION=true

# Run Forge-managed custom scripts for the target after its normal update.
RUN_CUSTOM_SCRIPTS=true
CUSTOM_SCRIPTS_DIR="/etc/proxmox-forge/scripts.d"


# -----------------------------------------------------------------------------
# Protection and validation
# -----------------------------------------------------------------------------

# Perform required low-cost checks before mutating a target (storage/resources,
# transport/connectivity and other checks required by the selected updater).
PREFLIGHT=true

# Establish a recovery point before mutating a target.
#
# Proxmox is authoritative for backup behaviour. Forge must read and respect
# the existing Proxmox guest/storage/backup configuration instead of defining
# its own backup mode, storage or mount-point inclusion policy.
PROTECTION=true

# If a required update/health stage fails and a safe same-run recovery point is
# available, Forge attempts to restore that target before continuing.
ROLLBACK_ON_FAILURE=true

# Validate target health after mutation before declaring success.
HEALTH_CHECK=true


# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------

LOG_DIR="/var/log/proxmox-forge"

# Keep the most recent runs per target.
LOG_KEEP=8
