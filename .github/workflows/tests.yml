name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Configuration, integration and execution safety (F206/F207/F209/F211/F213)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check public CLI executable permission
        run: |
          test -x forge || { echo 'ERROR: forge must be executable (Git mode 100755)'; exit 1; }
      - name: Check shell syntax
        run: |
          bash -n forge
          find lib -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
      - name: Run automated tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
